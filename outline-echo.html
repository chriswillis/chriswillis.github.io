:root{
  --stage:#D8D9DC; --panel:#F6F6F7; --ink:#18191C; --muted:#696C73; --rule:#D2D4D8;
  --control:#E4E5E8; --control-on:#18191C; --control-on-ink:#FFFFFF; --focus:#2F5BEA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#131417; --panel:#1C1E22; --ink:#ECEDEF; --muted:#9A9DA4; --rule:#33363C;

  }
}
:root[data-theme="dark"]{
  --stage:#131417; --panel:#1C1E22; --ink:#ECEDEF; --muted:#9A9DA4; --rule:#33363C;
  --control:#2A2D32; --control-on:#ECEDEF; --control-on-ink:#131417; --focus:#8EA7FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background:var(--stage);color:var(--ink);
  font:14px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;grid-template-columns:minmax(0,1fr) 320px;
}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:28px;min-height:0;min-width:0}
canvas#poster{display:block;box-shadow:0 1px 2px rgba(0,0,0,.18),0 12px 40px rgba(0,0,0,.14);background:#000}
.status{position:absolute;left:28px;bottom:10px;font-size:12px;color:var(--muted)}
.panel{background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.head{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--rule);padding:16px 18px 14px}
.head h1{font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.head p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--rule);background:var(--control);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--control-on);color:var(--control-on-ink);border-color:var(--control-on)}
.btn[hidden]{display:none}
section{padding:14px 18px 16px;border-bottom:1px solid var(--rule)}
section h2{font-size:13px;font-weight:600;margin:0 0 10px}
.row{margin:0 0 11px}
.row:last-child{margin-bottom:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.lab output{color:var(--ink);font-variant-numeric:tabular-nums}
textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--control);border:1px solid var(--rule);border-radius:7px;padding:7px 9px
}
textarea{resize:vertical;min-height:112px;font-size:14px;line-height:1.35}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--rule);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-6px;border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--panel)}
.seg{display:flex;background:var(--control);border:1px solid var(--rule);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px 4px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:4px}
.check input{accent-color:var(--ink);width:15px;height:15px;margin:0}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
[hidden]{display:none!important}
.stop{display:grid;grid-template-columns:40px minmax(0,1fr) 38px 28px;align-items:center;gap:8px;margin-bottom:6px}
.stop input[type=color]{height:28px}
.stop output{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stop .x{border:1px solid var(--rule);background:var(--control);border-radius:6px;height:28px;font-size:15px;line-height:1;color:var(--muted)}
.stop .x:disabled{opacity:.35;cursor:default}
.colors label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=color]{width:100%;height:30px;border:1px solid var(--rule);border-radius:7px;background:var(--control);padding:2px;cursor:pointer}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:40px;height:30px;border-radius:7px;border:1px solid var(--rule);position:relative;overflow:hidden;padding:0}
.swatch span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 600 16px "EB Garamond",Georgia,serif}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
@media (max-width: 820px){
  body{grid-template-columns:1fr;grid-template-rows:58% minmax(0,1fr)}
  .stage{padding:16px}
  .status{left:16px;bottom:2px}
  .panel{border-left:0;border-top:1px solid var(--rule)}
}

<body>
<main class="stage" id="stage">
  <canvas id="poster" aria-label="Poster preview"></canvas>
  <div class="status" id="status" aria-live="polite"></div>
</main>

<aside class="panel">
  <div class="head">
    <h1>Yves Outlines</h1>
    <p>Concentric outlines grow from each letterform or word.</p>
    <div class="actions">
      <button class="btn primary" id="play" aria-pressed="false">Play</button>
      <button class="btn" id="shuffle">🎲 Shuffle</button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn" id="copyLink" hidden>🔗 Copy link</button>
      <button class="btn" id="save" hidden>Save PNG</button>
    </div>
  </div>

  <section>
    <h2>Text</h2>
    <div class="row"><textarea id="text" spellcheck="false" aria-label="Text"></textarea></div>
    <div class="row">
      <div class="lab"><span>Typeface</span></div>
      <select id="font" aria-label="Typeface"></select>
    </div>
    <div class="row two">
      <div>
        <div class="lab"><span>Weight</span></div>
        <select id="weight" aria-label="Weight">
          <option value="300">Light</option><option value="400">Regular</option>
          <option value="500">Medium</option><option value="600">Semibold</option>
          <option value="700">Bold</option><option value="800">Extra bold</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;padding-bottom:6px">
        <label class="check"><input type="checkbox" id="italic"> Italic</label>
      </div>
    </div>
    <div class="row">
      <div class="lab"><span>Case</span></div>
      <div class="seg" data-key="textCase">
        <button data-v="as">As typed</button><button data-v="upper">Uppercase</button><button data-v="lower">Lowercase</button>
      </div>
    </div>
    <div id="textSliders"></div>
    <div class="row"><button class="btn" id="fit">Fit text to canvas</button></div>
    <div class="row">
      <div class="lab"><span>Alignment</span></div>
      <div class="seg" data-key="align">
        <button data-v="left">Left</button><button data-v="center">Center</button><button data-v="right">Right</button>
      </div>
    </div>
    <div class="row">
      <div class="lab"><span>Vertical position</span></div>
      <div class="seg" data-key="valign">
        <button data-v="top">Top</button><button data-v="middle">Center</button><button data-v="bottom">Bottom</button>
      </div>
    </div>
  </section>

  <section>
    <h2>Outlines</h2>
    <div class="row">
      <div class="lab"><span>Grow from each</span></div>
      <div class="seg" data-key="group">
        <button data-v="letter">Letter</button><button data-v="word">Word</button><button data-v="line">Line</button>
      </div>
    </div>
    <div id="ringSliders"></div>
  </section>

  <section>
    <h2>Drift</h2>
    <div id="driftSliders"></div>
    <p class="note">How far each ring shifts from the one before it, as a share of spacing.</p>
  </section>

  <section>
    <h2>Color</h2>
    <div class="row swatches" id="swatches"></div>
    <div class="row">
      <div class="lab"><span>Background</span></div>
      <div class="seg" data-key="bgMode">
        <button data-v="solid">Solid</button><button data-v="gradient">Gradient</button>
      </div>
    </div>
    <div id="gradPanel" hidden>
      <div class="row swatches" id="gradSwatches"></div>
      <div class="row">
        <div class="seg" data-key="gradType">
          <button data-v="linear">Linear</button><button data-v="radial">Radial</button>
        </div>
      </div>
      <div id="gradSliders"></div>
      <div class="row" id="stops" role="group" aria-label="Gradient stops"></div>
      <div class="row actions">
        <button class="btn" id="addStop">Add stop</button>
        <button class="btn" id="revStops">Reverse</button>
      </div>
    </div>
    <div class="row colors">
      <label id="bgWrap">Background<input type="color" id="bg"></label>
      <label>Type<input type="color" id="type"></label>
      <label>Outlines<input type="color" id="ring"></label>
    </div>
    <div class="row">
      <div class="lab"><span>Overlap</span></div>
      <select id="blend" aria-label="Overlap blending">
        <option value="source-over">Normal</option>
        <option value="lighter">Add (glows where rings cross)</option>
        <option value="screen">Screen</option>
        <option value="multiply">Multiply (for dark lines on light)</option>
        <option value="difference">Difference</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="showType"> Show type</label>
    <label class="check"><input type="checkbox" id="ringsOver"> Outlines over type</label>
  </section>

  <section>
    <h2>Canvas and motion</h2>
    <div class="row">
      <div class="lab"><span>Format</span></div>
      <select id="format" aria-label="Format">
        <option value="4:5">Portrait 4:5 · 1200 × 1500</option>
        <option value="A">A-series · 1200 × 1697</option>
        <option value="1:1">Square · 1400 × 1400</option>
        <option value="9:16">Story 9:16 · 1080 × 1920</option>
        <option value="16:9">Landscape 16:9 · 1920 × 1080</option>
        <option value="og">Share image · 1200 × 630</option>
      </select>
    </div>
    <div id="motionSliders"></div>
    <div class="row" id="exportRow" hidden>
      <div class="lab"><span>Export size</span></div>
      <div class="seg" data-key="exportScale">
        <button data-v="1">1×</button><button data-v="2">2×</button><button data-v="3">3×</button>
      </div>
    </div>
  </section>
</aside>

    var ax=unit.glyphs[0].x, ay=unit.glyphs[0].y;
    var k=unit.glyphs.map(function(g){return g.ch+"@"+(g.x-ax).toFixed(2);}).join(",");
    var f=sdfStore.map.get(k);
    if(!f){ f=makeField(unit,ax,ay,L.size,res,pad); sdfStore.map.set(k,f); }
    used.add(k);
    return {tex:f.tex,x:ax+f.ox,y:ay+f.oy,w:f.w,h:f.h};
  });
  if(sdfStore.map.size>400){
    sdfStore.map.forEach(function(f,k){ if(!used.has(k)){gl.deleteTexture(f.tex);sdfStore.map.delete(k);} });
  }
  return {units:units};
}
function hexRGB(h){h=h.replace("#","");if(h.length===3)h=h.replace(/./g,"$&$&");var n=parseInt(h,16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}

function drawRingsGL(c,L,s,phase,res){
  var gl=GL.gl, loc=GL.loc;
  var N=Math.round(state.count), sp=state.spacing, hw=state.line/2, gap=state.gap, maxU=N+1;
  var ddx=state.dx*sp, ddy=state.dy*sp;
  var S=buildSDF(L,res,gap+maxU*sp+hw+4);
  var outW=Math.round(L.W*s), outH=Math.round(L.H*s);
  var tw=Math.min(outW,GL.maxTile), th=Math.min(outH,GL.maxTile);
  if(GL.cv.width!==tw||GL.cv.height!==th){GL.cv.width=tw;GL.cv.height=th;}
  gl.useProgram(GL.prog); gl.bindVertexArray(GL.vao);
  gl.enable(gl.BLEND);
  var add=state.blend==="lighter";
  if(add) gl.blendFunc(gl.ONE,gl.ONE);
  else if(state.blend==="screen") gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_COLOR);
  else gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  var col=hexRGB(state.ring);
  gl.uniform1f(loc.u_scale,s); gl.uniform2f(loc.u_res,tw,th);
  gl.uniform1f(loc.u_gap,gap); gl.uniform1f(loc.u_sp,sp); gl.uniform1f(loc.u_hw,hw);
  gl.uniform1f(loc.u_op,state.opacity); gl.uniform1f(loc.u_fade,state.fade); gl.uniform1f(loc.u_phase,phase);
  gl.uniform1f(loc.u_add,add?1:0); gl.uniform1i(loc.u_n,N); gl.uniform2f(loc.u_drift,ddx,ddy);
  gl.uniform3f(loc.u_col,col[0],col[1],col[2]); gl.uniform1i(loc.u_sdf,0);
  gl.activeTexture(gl.TEXTURE0);
  var ex0=Math.min(0,ddx*maxU), ex1=Math.max(0,ddx*maxU), ey0=Math.min(0,ddy*maxU), ey1=Math.max(0,ddy*maxU);
  c.save(); c.globalCompositeOperation=state.blend; c.globalAlpha=1;
  for(var ty=0;ty<outH;ty+=th){
    for(var tx=0;tx<outW;tx+=tw){
      gl.viewport(0,0,tw,th); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(loc.u_origin,tx,ty);
      S.units.forEach(function(u){
        var qx=u.x+ex0, qy=u.y+ey0, qw=u.w+ex1-ex0, qh=u.h+ey1-ey0;
        if((qx+qw)*s<tx||qx*s>tx+tw||(qy+qh)*s<ty||qy*s>ty+th) return;
        gl.bindTexture(gl.TEXTURE_2D,u.tex);
        gl.uniform4f(loc.u_quad,qx,qy,qw,qh);
        gl.uniform4f(loc.u_box,u.x,u.y,u.w,u.h);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      });
      var cw=Math.min(tw,outW-tx), ch=Math.min(th,outH-ty);
      c.drawImage(GL.cv,0,0,cw,ch,tx,ty,cw,ch);
    }
  }
  c.restore();
}

/* ---------- Rendering ---------- */
function paintGround(c,W,H){
  if(state.bgMode!=="gradient"||state.stops.length<2){ c.fillStyle=state.bg; c.fillRect(0,0,W,H); return; }
  var gr;
  if(state.gradType==="radial"){
    gr=c.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.hypot(W,H)/2);
  } else {
    // CSS convention: 180° runs top to bottom, 90° left to right
    var a=state.gradAngle*Math.PI/180, dx=Math.sin(a), dy=-Math.cos(a);
    var half=Math.abs(W/2*dx)+Math.abs(H/2*dy);
    gr=c.createLinearGradient(W/2-dx*half,H/2-dy*half,W/2+dx*half,H/2+dy*half);
  }
  state.stops.slice().sort(function(a,b){return a[1]-b[1];}).forEach(function(st){
    gr.addColorStop(Math.max(0,Math.min(1,st[1])),st[0]);
  });
  c.fillStyle=gr; c.fillRect(0,0,W,H);
}
function drawType(c,L,s){
  if(!state.showType) return;
  c.save();
  c.globalCompositeOperation="source-over"; c.globalAlpha=1;
  c.fillStyle=state.type; c.font=fontString(L.size*s); c.textBaseline="alphabetic";
  L.glyphs.forEach(function(g){ if(!g.space) c.fillText(g.ch,g.x*s,g.y*s); });
  c.restore();
}

function drawRings(c,L,s,phase){
  var N=Math.round(state.count), sp=state.spacing*s, w=state.line*s, gap=state.gap*s;
  var dxs=state.dx*sp, dys=state.dy*sp; // drift per ring, relative to spacing
  var maxU=N+1;
  var pad=Math.ceil(gap+maxU*sp+w+2);
  var padX=pad+Math.ceil(maxU*Math.abs(dxs)), padY=pad+Math.ceil(maxU*Math.abs(dys));
  var font=fontString(L.size*s);

  // alpha envelope for each ring position
  var rings=[];
  for(var k=0;k<=N;k++){
    var u=k+phase;
    var a=state.opacity*Math.min(1,u)*Math.max(0,Math.min(1,maxU-u))*(1-state.fade*(u/maxU));
    if(a>0.002) rings.push({u:u,a:a});
  }

  c.save();
  c.globalCompositeOperation=state.blend;

  L.units.forEach(function(unit){
    var bx=Math.floor(unit.x0*s-padX), by=Math.floor(unit.y0*s-padY);
    var bw=Math.ceil((unit.x1-unit.x0)*s+2*padX), bh=Math.ceil((unit.y1-unit.y0)*s+2*padY);
    if(scratch.width<bw||scratch.height<bh){
      scratch.width=Math.max(scratch.width,bw); scratch.height=Math.max(scratch.height,bh);
    }
    sctx.font=font; sctx.textBaseline="alphabetic";
    sctx.lineJoin="round"; sctx.lineCap="round";
    sctx.fillStyle=state.ring; sctx.strokeStyle=state.ring;

    rings.forEach(function(r){
      var d=gap+r.u*sp;
      var ox=-bx+r.u*dxs, oy=-by+r.u*dys;
      sctx.globalCompositeOperation="source-over";
      sctx.clearRect(0,0,bw,bh);
      // outer boundary: glyph grown by d + w/2
      var outer=2*d+w;
      sctx.lineWidth=outer;
      unit.glyphs.forEach(function(g){ var x=g.x*s+ox, y=g.y*s+oy; sctx.fillText(g.ch,x,y); sctx.strokeText(g.ch,x,y); });
      // carve inner boundary: glyph grown by d - w/2
      sctx.globalCompositeOperation="destination-out";
      var inner=2*d-w;
      unit.glyphs.forEach(function(g){ var x=g.x*s+ox, y=g.y*s+oy; sctx.fillText(g.ch,x,y); });
      if(inner>0.01){
        sctx.lineWidth=inner;
        unit.glyphs.forEach(function(g){ sctx.strokeText(g.ch,g.x*s+ox,g.y*s+oy); });
      }
      c.globalAlpha=r.a;
      c.drawImage(scratch,0,0,bw,bh,bx,by,bw,bh);
    });
  });
  c.restore();
}

var PREVIEW_RES=0.75;
function rings(c,L,s,phase,res){
  if(GL) drawRingsGL(c,L,s,phase,res); else drawRings(c,L,s,phase);
}
function render(c,s,phase,res){
  var L=getLayout();
  c.save();
  c.setTransform(1,0,0,1,0,0);
  c.globalCompositeOperation="source-over"; c.globalAlpha=1;
  paintGround(c,L.W*s,L.H*s);
  res=res||PREVIEW_RES;
  if(state.ringsOver){ drawType(c,L,s); rings(c,L,s,phase,res); }
  else { rings(c,L,s,phase,res); drawType(c,L,s); }
  c.restore();
}

/* ---------- Canvas sizing ---------- */
function sizeCanvas(){
  var fmt=FORMATS[state.format]||FORMATS["4:5"];
  if(canvas.width!==fmt[0]||canvas.height!==fmt[1]){ canvas.width=fmt[0]; canvas.height=fmt[1]; }
  fitCanvas();
}
function fitCanvas(){
  var st=$("stage"), cs=getComputedStyle(st);
  var aw=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  var ah=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  var r=Math.min(aw/canvas.width,ah/canvas.height);
  if(!(r>0)) return;
  canvas.style.width=Math.floor(canvas.width*r)+"px";
  canvas.style.height=Math.floor(canvas.height*r)+"px";
}

/* ---------- Loop ---------- */
var pending=false, playing=false, phase=0, lastT=0;
function requestRender(){
  persist();
  if(playing||pending) return;
  pending=true;
  requestAnimationFrame(function(){ pending=false; render(ctx,1,0); });
}
function tick(t){
  if(!playing) return;
  var dt=lastT?Math.min(0.1,(t-lastT)/1000):0; lastT=t;
  phase=(phase+dt*state.speed*1.5)%1;
  render(ctx,1,phase);
  requestAnimationFrame(tick);
}
$("play").addEventListener("click",function(){
  playing=!playing;
  this.textContent=playing?"Pause":"Play";
  this.setAttribute("aria-pressed",String(playing));
  if(playing){ lastT=0; requestAnimationFrame(tick); }
  else { phase=0; requestRender(); }
});

function rnd(a,b,step){var v=a+Math.random()*(b-a);return step?Math.round(v/step)*step:v;}
$("shuffle").addEventListener("click",function(){
  state.count=Math.round(rnd(6,30));
  state.spacing=rnd(2.5,14,0.5);
  state.line=rnd(0.75,Math.min(4,state.spacing*0.7),0.25);
  state.opacity=rnd(0.3,0.85,0.01);
  state.fade=rnd(0,0.9,0.01);
  state.gap=Math.random()<0.7?0:rnd(2,24,0.5);
  state.dx=Math.random()<0.4?0:rnd(-0.6,0.6,0.01);
  state.dy=Math.random()<0.3?0:rnd(-0.6,0.8,0.01);
  state.group=["letter","letter","word","line"][Math.floor(Math.random()*4)];
  syncAll(); requestRender();
});
$("fit").addEventListener("click",function(){
  var fmt=FORMATS[state.format]||FORMATS["4:5"];
  var L=getLayout(), maxW=0, rows={};
  L.glyphs.forEach(function(g){ if(g.space) return; var r=rows[g.y]||(rows[g.y]={a:Infinity,b:-Infinity}); r.a=Math.min(r.a,g.x); r.b=Math.max(r.b,g.x+g.w); });
  Object.keys(rows).forEach(function(k){ maxW=Math.max(maxW,rows[k].b-rows[k].a); });
  if(!maxW) return;
  // block height scales linearly with size: cap height of line 1 + leading steps + last descender
  sctx.font=fontString(state.size);
  var cap=sctx.measureText("HDLK").actualBoundingBoxAscent||state.size*0.7;
  var desc=sctx.measureText("gjpqy").actualBoundingBoxDescent||state.size*0.2;
  var n=Object.keys(rows).length;
  var blockH=cap+(n-1)*state.size*state.leading+desc;
  var next=state.size*Math.min((fmt[0]-2*state.margin)/maxW,(fmt[1]-2*state.margin)/blockH);
  state.size=Math.round(Math.max(24,Math.min(900,next)));
  syncAll(); requestRender();
});
$("reset").addEventListener("click",function(){
  state=JSON.parse(JSON.stringify(DEFAULTS));
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
  syncAll(); sizeCanvas(); loadFont().then(requestRender);
});

/* ---------- Export ---------- */
var downloads=null;
var standalone=STANDALONE;
function setupExport(){
  if(standalone){ $("save").hidden=false; $("exportRow").hidden=false; return; }
  window.claude.use("downloads").then(function(d){
    if(!d) return;
    downloads=d; $("save").hidden=false; $("exportRow").hidden=false;
  },function(){});
}
// Opened as a plain file or on your own site: a normal browser download
function browserSave(name,blob){
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  statusEl.textContent="Saved "+name;
}
$("save").addEventListener("click",function(){
  if(!downloads&&!standalone) return;
  var s=parseFloat(state.exportScale)||1, fmt=FORMATS[state.format];
  var off=document.createElement("canvas"); off.width=fmt[0]*s; off.height=fmt[1]*s;
  statusEl.textContent="Rendering "+off.width+" × "+off.height+"…";
  setTimeout(function(){
    render(off.getContext("2d"),s,playing?phase:0,Math.min(1.5,s));
    off.toBlob(function(blob){
      if(!blob){statusEl.textContent="Export failed at this size. Try a smaller export size.";return;}
      var name=(state.text.trim().split(/\s+/).slice(0,3).join("-").toLowerCase().replace(/[^a-z0-9-]/g,"")||"outline-echo")+".png";
      if(standalone){ browserSave(name,blob); return; }
      downloads.save({filename:name,data:blob}).then(function(){statusEl.textContent="Saved "+name;},function(e){
        var code=e&&e.code;
        statusEl.textContent=code==="declined"?"":code==="too_large"?"That file is too large here. Try a smaller export size.":"Saving isn't available in this view.";
        if(code==="unavailable"||code==="not_granted"){$("save").hidden=true;$("exportRow").hidden=true;}
      });
    },"image/png");
  },20);
});

/* ---------- Copy link + following pasted links ---------- */
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    var ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    var ok=false; try{ok=document.execCommand("copy");}catch(e){}
    ta.remove(); ok?res():rej();
  });
}
var copyTimer=0;
$("copyLink").addEventListener("click",function(){
  var btn=this, url=shareURL(playing);
  writeURL();
  copyText(url).then(function(){
    btn.textContent="Link copied"; statusEl.textContent="";
    clearTimeout(copyTimer); copyTimer=setTimeout(function(){btn.textContent="Copy link";},2000);
  },function(){
    window.prompt("Copy this link:",url);
  });
});
window.addEventListener("hashchange",function(){
  var link=decodeState(location.hash);
  if(!link.values) return;
  state=JSON.parse(JSON.stringify(DEFAULTS));
  Object.keys(link.values).forEach(function(k){ state[k]=link.values[k]; });
  syncAll(); sizeCanvas(); loadFont().then(requestRender); requestRender();
});

/* ---------- Init ---------- */
buildSliders(); buildSegs(); buildOthers(); syncAll();
sizeCanvas();
if(window.ResizeObserver) new ResizeObserver(fitCanvas).observe($("stage"));
else window.addEventListener("resize",fitCanvas);
render(ctx,1,0);
loadFont().then(function(){ requestRender(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){layoutCache.key=null;sdfStore.base=null;requestRender();});
setupExport();
if(STANDALONE) $("copyLink").hidden=false;
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(initialLink.play&&!reduceMotion) $("play").click();
})();
</script>
